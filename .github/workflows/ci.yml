name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx @biomejs/biome check --reporter=github .

      - name: Validate outbox invariants
        run: bun run scripts/validate-outbox-invariant.ts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: tsc (all packages)
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Debug test discovery
        run: |
          echo "=== Test files on disk ==="
          find packages -name '*.test.ts' -o -name '*.test.tsx' | grep -v node_modules | wc -l
          echo "=== Per-package counts ==="
          for pkg in shared core agent llm sandbox sync platforms web client mcp-server cli less; do
            count=$(find "packages/$pkg" -name '*.test.ts' -o -name '*.test.tsx' | grep -v node_modules | wc -l)
            echo "  $pkg: $count files"
          done
          echo "=== node_modules check ==="
          for pkg in agent sync platforms web less; do
            if [ -d "packages/$pkg/node_modules" ]; then
              echo "  $pkg: node_modules exists ($(ls packages/$pkg/node_modules/ | wc -l) entries)"
            else
              echo "  $pkg: NO node_modules"
            fi
          done
          echo "=== Single file import test ==="
          for pkg in agent sync platforms web less; do
            first=$(find "packages/$pkg" -name '*.test.ts' | grep -v node_modules | head -1)
            echo -n "  $pkg ($first): "
            bun test "$first" 2>&1 | tail -1
          done

      - name: Unit tests
        run: bun test --recursive
