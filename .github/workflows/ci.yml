name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Biome check
        run: bunx @biomejs/biome check --reporter=github .

      - name: Validate outbox invariants
        run: bun run scripts/validate-outbox-invariant.ts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: tsc (all packages)
        run: bun run typecheck

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Unit tests
        shell: bash
        run: |
          # bun test --recursive silently skips 5 packages on Linux due to a
          # workspace test-discovery bug. Run each package explicitly instead.
          # --reporter=junit writes a machine-parseable result file per package
          # (the console reporter still prints the assertion diff to stderr, so
          # the per-package log group keeps the "why").
          #
          # We also write a per-package "<pkg>.exit" sidecar with that package's
          # process exit code. The summary step reconciles it against the JUnit
          # failure count: a package that exits nonzero with zero recorded test
          # failures is a process-level failure (crash / unhandled rejection /
          # teardown error like Windows EBUSY) that a pure-JUnit summary would
          # render as "all green". The sidecar is what makes that case visible.
          mkdir -p test-results
          exit_code=0
          for pkg in shared core sync sandbox llm agent platforms web client mcp-server cli less; do
            echo "::group::packages/$pkg"
            pkg_code=0
            bun test "packages/$pkg" --reporter=junit --reporter-outfile="test-results/$pkg.xml" || pkg_code=$?
            echo "$pkg_code" > "test-results/$pkg.exit"
            if [ "$pkg_code" -ne 0 ]; then exit_code=$pkg_code; fi
            echo "::endgroup::"
          done
          exit $exit_code

      - name: Test summary
        if: ${{ !cancelled() }}
        # Renders the per-package JUnit into the job summary (queryable table +
        # failing-test index with file:line) and emits one ::error annotation
        # per failure so failures surface inline without scrolling the log.
        # Also reconciles each package's exit-code sidecar against its JUnit
        # failure count and flags process-level failures (nonzero exit, no
        # recorded test failure) that the raw JUnit reports as green.
        run: bun run scripts/ci-test-summary.ts test-results

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results-${{ matrix.os }}
          # Whole dir: the *.xml JUnit plus the *.exit sidecars, so a
          # process-level failure is reconstructable offline from the artifact.
          path: test-results/
          if-no-files-found: ignore
